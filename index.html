<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 区块链安全事件监控 - 比特丛林</title>
    <meta name="description" content="实时监控区块链安全事件，包括币被盗、钱包攻击、DeFi安全漏洞等">
    <meta name="keywords" content="区块链安全,加密货币,币被盗,钱包安全,DeFi攻击,智能合约漏洞">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #0f172a;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #334155;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --info: #3b82f6;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* 页头样式 */
        .header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .logo i {
            font-size: 42px;
            color: var(--accent-light);
            animation: pulse 2s infinite;
        }
        
        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            margin-top: 10px;
        }
        
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: var(--accent);
        }
        
        .stat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        
        .stat-title {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 5px;
        }
        
        .stat-change {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .stat-high .stat-icon { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .stat-medium .stat-icon { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .stat-low .stat-icon { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .stat-total .stat-icon { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }
        
        /* 事件列表 */
        .events-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }
        
        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--accent-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .event-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            border-left: 4px solid var(--accent);
            transition: all 0.3s ease;
        }
        
        .event-card:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }
        
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .event-time {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }
        
        .risk-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .risk-high { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .risk-medium { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .risk-low { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        
        .event-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        
        .event-content {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 20px;
            white-space: pre-line;
        }
        
        .event-meta {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .meta-item i {
            font-size: 14px;
        }
        
        /* 链接按钮 */
        .event-links {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
            border: 1px solid var(--accent);
        }
        
        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent-light);
        }
        
        /* 页脚 */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        
        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .footer-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--accent-light);
        }
        
        .footer-info {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .footer-status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: blink 2s infinite;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
        }
        
        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .footer-links a:hover {
            color: var(--accent-light);
        }
        
        /* 动画 */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .logo h1 {
                font-size: 28px;
            }
            
            .stat-value {
                font-size: 30px;
            }
            
            .event-title {
                font-size: 18px;
            }
            
            .event-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .header {
                padding: 30px 15px;
            }
            
            .events-section {
                padding: 20px;
            }
            
            .event-card {
                padding: 20px;
            }
        }
        
        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页头 -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <h1>🚨 区块链安全事件监控</h1>
            </div>
            <div class="subtitle">
                实时追踪加密货币安全威胁 | 数据来源：推特API + 实时监控
            </div>
        </header>
        
        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card stat-total">
                <div class="stat-header">
                    <div class="stat-icon">
                        <i class="fas fa-bug"></i>
                    </div>
                    <div class="stat-title">累计事件</div>
                </div>
                <div class="stat-value" id="total-events">0</div>
                <div class="stat-change">实时更新</div>
            </div>
            
            <div class="stat-card stat-high">
                <div class="stat-header">
                    <div class="stat-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="stat-title">高风险事件</div>
                </div>
                <div class="stat-value" id="high-risk">0</div>
                <div class="stat-change">最高优先级</div>
            </div>
            
            <div class="stat-card stat-medium">
                <div class="stat-header">
                    <div class="stat-icon">
                        <i class="fas fa-exclamation-circle"></i>
                    </div>
                    <div class="stat-title">中风险事件</div>
                </div>
                <div class="stat-value" id="medium-risk">0</div>
                <div class="stat-change">密切关注</div>
            </div>
            
            <div class="stat-card stat-low">
                <div class="stat-header">
                    <div class="stat-icon">
                        <i class="fas fa-info-circle"></i>
                    </div>
                    <div class="stat-title">低风险事件</div>
                </div>
                <div class="stat-value" id="low-risk">0</div>
                <div class="stat-change">正常监控</div>
            </div>
        </div>
        
        <!-- 事件列表 -->
        <section class="events-section">
            <h2 class="section-title">
                <i class="fas fa-bolt"></i> 最新安全事件
            </h2>
            <div class="events-list" id="events-list">
                <!-- 事件将通过JavaScript动态加载 -->
            </div>
        </section>
        
        <!-- 页脚 -->
        <footer class="footer">
            <div class="footer-content">
                <div class="footer-title">比特丛林安全监控系统</div>
                <div class="footer-info">
                    <p>系统实时监控推特上的加密货币安全事件，包括币被盗、钱包攻击、DeFi漏洞等。</p>
                    <p>数据更新时间：<span id="last-updated">正在加载...</span></p>
                    <p>版本：v2.0 | 最后更新：<span id="data-update">正在加载...</span></p>
                </div>
                <div class="footer-status">
                    <div class="status-indicator"></div>
                    <span>系统状态：<span id="system-status">正常</span></span>
                </div>
                <div class="footer-links">
                    <a href="https://bitjungle-cn.github.io/security-monitor/" target="_blank">
                        <i class="fas fa-external-link-alt"></i>访问网站
                    </a>
                    <a href="https://github.com/bitjungle-cn/security-monitor" target="_blank">
                        <i class="fab fa-github"></i>GitHub仓库
                    </a>
                    <a href="#" onclick="refreshData()">
                        <i class="fas fa-sync-alt"></i>刷新数据
                    </a>
                </div>
            </div>
        </footer>
    </div>
    
    <script>
        // 区块链安全监控网页应用
        class SecurityMonitorApp {
            constructor() {
                this.data = null;
                this.init();
            }
            
            async init() {
                console.log('🔍 初始化区块链安全监控页面...');
                
                // 显示加载状态
                this.showLoading();
                
                // 加载数据
                await this.loadData();
                
                // 更新页面
                this.updatePage();
                
                // 绑定事件
                this.bindEvents();
                
                // 每5分钟自动刷新一次
                setInterval(() => this.loadData(), 5 * 60 * 1000);
            }
            
            async loadData() {
                try {
                    console.log('📥 加载数据...');
                    
                    const response = await fetch('./data/events.json');
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    this.data = data;
                    
                    console.log(`✅ 数据加载成功，共 ${data.events.length} 个事件`);
                    return true;
                    
                } catch (error) {
                    console.error('❌ 加载数据失败:', error);
                    this.showError('数据加载失败，请稍后重试');
                    return false;
                }
            }
            
            updatePage() {
                if (!this.data || !this.data.metadata) {
                    this.showError('数据格式错误');
                    return;
                }
                
                const metadata = this.data.metadata;
                const events = this.data.events;
                
                // 更新统计
                document.getElementById('total-events').textContent = metadata.total_events || 0;
                document.getElementById('high-risk').textContent = metadata.high_risk || 0;
                document.getElementById('medium-risk').textContent = metadata.medium_risk || 0;
                document.getElementById('low-risk').textContent = metadata.low_risk || 0;
                
                // 更新时间信息
                const now = new Date();
                const lastUpdated = metadata.last_updated ? new Date(metadata.last_updated) : now;
                
                document.getElementById('last-updated').textContent = this.formatDateTime(lastUpdated);
                document.getElementById('data-update').textContent = this.formatDateTime(lastUpdated);
                
                // 更新事件列表
                this.updateEventsList(events);
                
                // 更新状态
                document.getElementById('system-status').textContent = '正常运行';
                
                // 隐藏加载状态
                this.hideLoading();
            }
            
            updateEventsList(events) {
                const container = document.getElementById('events-list');
                
                if (!events || events.length === 0) {
                    container.innerHTML = `
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>暂无安全事件</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                
                events.forEach((event, index) => {
                    const time = new Date(event.timestamp);
                    const formattedTime = this.formatDateTime(time);
                    
                    // 风险等级
                    const riskClass = this.getRiskClass(event.risk);
                    const riskText = this.getRiskText(event.risk);
                    
                    // 平台图标
                    const platformIcon = this.getPlatformIcon(event.platform);
                    
                    // 处理内容
                    const content = event.content || '';
                    const truncatedContent = content.length > 300 ? content.substring(0, 300) + '...' : content;
                    
                    // 统计信息
                    const views = event.metrics?.views || 0;
                    const likes = event.metrics?.likes || 0;
                    const retweets = event.metrics?.retweets || 0;
                    
                    // 链接
                    const sourceUrl = event.source_url || '#';
                    const urls = event.urls || [];
                    
                    html += `
                    <div class="event-card">
                        <div class="event-header">
                            <div class="event-time">
                                <i class="fas fa-clock"></i> ${formattedTime}
                            </div>
                            <div class="risk-badge ${riskClass}">${riskText}</div>
                        </div>
                        
                        <h3 class="event-title">${event.title || '未命名事件'}</h3>
                        
                        <div class="event-content">${truncatedContent}</div>
                        
                        <div class="event-meta">
                            <div class="meta-item">
                                <i class="fas fa-user"></i>
                                <span>${event.author || '未知作者'}</span>
                            </div>
                            <div class="meta-item">
                                ${platformIcon}
                                <span>${event.platform || '未知平台'}</span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-eye"></i>
                                <span>${views.toLocaleString()} 浏览</span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-heart"></i>
                                <span>${likes.toLocaleString()} 点赞</span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-retweet"></i>
                                <span>${retweets.toLocaleString()} 转发</span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-language"></i>
                                <span>${event.language || '未知'}</span>
                            </div>
                        </div>
                        
                        <div class="event-links">
                            <a href="${sourceUrl}" target="_blank" class="btn btn-primary">
                                <i class="fas fa-external-link-alt"></i>查看原文
                            </a>
                            ${urls.length > 0 ? `
                            <a href="${urls[0]}" target="_blank" class="btn btn-secondary">
                                <i class="fas fa-link"></i>相关链接
                            </a>
                            ` : ''}
                        </div>
                    </div>
                    `;
                });
                
                container.innerHTML = html;
            }
            
            getRiskClass(riskLevel) {
                switch (String(riskLevel).toLowerCase()) {
                    case '高': return 'risk-high';
                    case '中': return 'risk-medium';
                    case '低': return 'risk-low';
                    default: return 'risk-medium';
                }
            }
            
            getRiskText(riskLevel) {
                switch (String(riskLevel).toLowerCase()) {
                    case '高': return '高风险';
                    case '中': return '中风险';
                    case '低': return '低风险';
                    default: return '风险未知';
                }
            }
            
            getPlatformIcon(platform) {
                if (platform.includes('Twitter') || platform.includes('推特')) {
                    return '<i class="fab fa-twitter"></i>';
                } else if (platform.includes('BitJungle')) {
                    return '<i class="fas fa-shield-alt"></i>';
                } else {
                    return '<i class="fas fa-globe"></i>';
                }
            }
            
            formatDateTime(date) {
                if (!(date instanceof Date)) {
                    date = new Date(date);
                }
                
                const now = new Date();
                const diffMs = now - date;
                const diffMins = Math.floor(diffMs / (1000 * 60));
                const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                
                if (diffMins < 1) {
                    return '刚刚';
                } else if (diffMins < 60) {
                    return `${diffMins}分钟前`;
                } else if (diffHours < 24) {
                    return `${diffHours}小时前`;
                } else if (diffDays < 7) {
                    return `${diffDays}天前`;
                } else {
                    return date.toLocaleDateString('zh-CN', {
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }
            }
            
            showLoading() {
                const container = document.getElementById('events-list');
                container.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>正在加载安全事件数据...</p>
                    </div>
                `;
            }
            
            hideLoading() {
                // 加载状态会在更新事件列表时被替换
            }
            
            showError(message) {
                const container = document.getElementById('events-list');
                container.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: var(--warning); margin-bottom: 15px;"></i>
                        <p>${message}</p>
                        <button onclick="window.location.reload()" style="margin-top: 15px; padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            重试
                        </button>
                    </div>
                `;
            }
            
            bindEvents() {
                // 刷新按钮
                window.refreshData = async () => {
                    console.log('🔄 手动刷新数据...');
                    this.showLoading();
                    
                    const success = await this.loadData();
                    if (success) {
                        this.updatePage();
                        this.showToast('数据已刷新', 'success');
                    }
                };
                
                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'r' && e.ctrlKey) {
                        e.preventDefault();
                        window.refreshData();
                    }
                });
            }
            
            showToast(message, type = 'info') {
                // 创建toast元素
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                toast.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: ${type === 'success' ? 'var(--success)' : 
                                 type === 'error' ? 'var(--danger)' : 
                                 type === 'warning' ? 'var(--warning)' : 'var(--info)'};
                    color: white;
                    padding: 12px 24px;
                    border-radius: 8px;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                    z-index: 1000;
                    animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s;
                    max-width: 300px;
                `;
                
                // 添加动画样式
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes slideIn {
                        from {
                            transform: translateX(100%);
                            opacity: 0;
                        }
                        to {
                            transform: translateX(0);
                            opacity: 1;
                        }
                    }
                    @keyframes fadeOut {
                        from { opacity: 1; }
                        to { opacity: 0; }
                    }
                `;
                document.head.appendChild(style);
                
                document.body.appendChild(toast);
                
                // 3秒后自动移除
                setTimeout(() => {
                    if (toast.parentNode) {
                        document.body.removeChild(toast);
                    }
                }, 3000);
            }
        }
        
        // 启动应用
        document.addEventListener('DOMContentLoaded', () => {
            const app = new SecurityMonitorApp();
            
            // 使app在全局可访问（用于调试）
            window.app = app;
        });
    </script>
</body>
</html>
