<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 区块链安全事件监控 - 比特丛林</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #10b981;
            --secondary: #3b82f6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark);
            color: var(--light);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        
        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .header p {
            color: var(--gray);
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #334155;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }
        
        .stat-card.high-risk {
            border-left: 5px solid var(--danger);
        }
        
        .stat-card.medium-risk {
            border-left: 5px solid var(--warning);
        }
        
        .stat-card.low-risk {
            border-left: 5px solid var(--primary);
        }
        
        .stat-card.total {
            border-left: 5px solid var(--secondary);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: var(--gray);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .events-container {
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid #334155;
        }
        
        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        
        .events-header h2 {
            font-size: 1.8rem;
        }
        
        .risk-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .risk-high {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid #ef4444;
        }
        
        .risk-medium {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
            border: 1px solid #f59e0b;
        }
        
        .risk-low {
            background: rgba(16, 185, 129, 0.2);
            color: #a7f3d0;
            border: 1px solid #10b981;
        }
        
        .event-card {
            background: #0f172a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            transition: all 0.3s;
        }
        
        .event-card:hover {
            background: #1e293b;
            border-color: #475569;
            transform: translateX(5px);
        }
        
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .event-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--light);
        }
        
        .event-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        .event-content {
            margin-bottom: 20px;
            line-height: 1.7;
            color: #cbd5e1;
        }
        
        .event-metrics {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
        }
        
        .metric {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .metric i {
            font-size: 1.2rem;
        }
        
        .metric-value {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .metric-label {
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        .event-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .event-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--secondary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.3s;
        }
        
        .event-link:hover {
            background: #2563eb;
        }
        
        .footer {
            text-align: center;
            padding: 30px;
            color: var(--gray);
            font-size: 0.9rem;
            border-top: 1px solid #334155;
            margin-top: 40px;
        }
        
        .update-info {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
            margin-top: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--gray);
        }
        
        .loading i {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--primary);
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .stats-cards {
                grid-template-columns: 1fr;
            }
            
            .event-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .event-meta {
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .event-metrics {
                flex-wrap: wrap;
                gap: 15px;
            }
            
            .event-actions {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部区域 -->
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> 区块链安全事件监控</h1>
            <p>实时监控推特上的区块链安全事件，包括币被盗、钱包攻击、DeFi漏洞等安全威胁</p>
            <div class="update-info">
                <i class="fas fa-sync-alt"></i>
                <span>最后更新: <span id="last-updated">加载中...</span></span>
            </div>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-cards">
            <div class="stat-card total">
                <div class="stat-number" id="total-events">0</div>
                <div class="stat-label">累计事件</div>
            </div>
            <div class="stat-card high-risk">
                <div class="stat-number" id="high-risk">0</div>
                <div class="stat-label">高风险事件</div>
            </div>
            <div class="stat-card medium-risk">
                <div class="stat-number" id="medium-risk">0</div>
                <div class="stat-label">中风险事件</div>
            </div>
            <div class="stat-card low-risk">
                <div class="stat-number" id="low-risk">0</div>
                <div class="stat-label">低风险事件</div>
            </div>
        </div>
        
        <!-- 事件列表 -->
        <div class="events-container">
            <div class="events-header">
                <h2><i class="fas fa-exclamation-triangle"></i> 安全事件列表</h2>
                <div>
                    <span class="risk-badge risk-high">高风险</span>
                    <span class="risk-badge risk-medium">中风险</span>
                    <span class="risk-badge risk-low">低风险</span>
                </div>
            </div>
            
            <div id="events-list" class="loading">
                <i class="fas fa-spinner"></i>
                <p>正在加载安全事件数据...</p>
            </div>
        </div>
        
        <!-- 页脚 -->
        <div class="footer">
            <p>© 2026 比特丛林 | <i class="fas fa-globe"></i> 安全监控系统 v3.0</p>
            <p>数据来源: Twitter API 实时搜索 | 更新频率: 每2小时</p>
            <p><i class="fas fa-info-circle"></i> 注意: 所有数据均为真实推特安全事件</p>
        </div>
    </div>
    
    <script>
        // 加载数据
        async function loadData() {
            try {
                const response = await fetch('./data/events.json');
                const data = await response.json();
                
                // 更新统计
                document.getElementById('total-events').textContent = data.metadata.total_events || 0;
                document.getElementById('high-risk').textContent = data.metadata.high_risk || 0;
                document.getElementById('medium-risk').textContent = data.metadata.medium_risk || 0;
                document.getElementById('low-risk').textContent = data.metadata.low_risk || 0;
                document.getElementById('last-updated').textContent = 
                    new Date(data.metadata.last_updated).toLocaleString('zh-CN');
                
                // 显示事件
                displayEvents(data.events);
                
            } catch (error) {
                document.getElementById('events-list').innerHTML = `
                    <div class="loading">
                        <i class="fas fa-exclamation-circle" style="color: #ef4444;"></i>
                        <p>数据加载失败: ${error.message}</p>
                        <p>请检查网络连接或稍后重试</p>
                    </div>
                `;
            }
        }
        
        // 显示事件
        function displayEvents(events) {
            const container = document.getElementById('events-list');
            
            if (!events || events.length === 0) {
                container.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-check-circle" style="color: #10b981;"></i>
                        <p>暂无新的安全事件</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            events.forEach((event, index) => {
                const riskClass = getRiskClass(event.risk);
                const riskText = getRiskText(event.risk);
                
                // 格式化数字
                const views = event.metrics?.views?.toLocaleString() || '0';
                const likes = event.metrics?.likes?.toLocaleString() || '0';
                const retweets = event.metrics?.retweets?.toLocaleString() || '0';
                
                html += `
                <div class="event-card">
                    <div class="event-header">
                        <div>
                            <h3 class="event-title">${event.title || '安全事件'}</h3>
                            <span class="risk-badge ${riskClass}">${riskText}</span>
                        </div>
                        <div class="event-meta">
                            <span><i class="fas fa-user"></i> ${event.author || '未知作者'}</span>
                            <span><i class="fas fa-clock"></i> ${formatTime(event.timestamp)}</span>
                            <span><i class="fas fa-keyword"></i> ${event.keyword || '安全'}</span>
                        </div>
                    </div>
                    
                    <div class="event-content">
                        ${event.content || '暂无内容描述'}
                    </div>
                    
                    <div class="event-metrics">
                        <div class="metric">
                            <i class="fas fa-eye" style="color: #3b82f6;"></i>
                            <div>
                                <div class="metric-value">${views}</div>
                                <div class="metric-label">浏览</div>
                            </div>
                        </div>
                        <div class="metric">
                            <i class="fas fa-heart" style="color: #ef4444;"></i>
                            <div>
                                <div class="metric-value">${likes}</div>
                                <div class="metric-label">点赞</div>
                            </div>
                        </div>
                        <div class="metric">
                            <i class="fas fa-retweet" style="color: #10b981;"></i>
                            <div>
                                <div class="metric-value">${retweets}</div>
                                <div class="metric-label">转发</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="event-actions">
                        <div>
                            <span><i class="fas fa-calendar"></i> 处理时间: ${formatTime(event.processed_at)}</span>
                        </div>
                        <a href="${event.source_url || '#'}" target="_blank" class="event-link" rel="noopener">
                            <i class="fas fa-external-link-alt"></i> 查看原文
                        </a>
                    </div>
                </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // 获取风险等级对应的CSS类
        function getRiskClass(risk) {
            switch(risk) {
                case '高': return 'risk-high';
                case '中': return 'risk-medium';
                case '低': return 'risk-low';
                default: return 'risk-medium';
            }
        }
        
        // 获取风险等级文本
        function getRiskText(risk) {
            switch(risk) {
                case '高': return '高风险';
                case '中': return '中风险';
                case '低': return '低风险';
                default: return '未知风险';
            }
        }
        
        // 格式化时间
        function formatTime(timestamp) {
            if (!timestamp) return '未知时间';
            
            try {
                const date = new Date(timestamp);
                const now = new Date();
                const diff = now - date;
                const minutes = Math.floor(diff / 60000);
                const hours = Math.floor(minutes / 60);
                const days = Math.floor(hours / 24);
                
                if (minutes < 1) return '刚刚';
                if (minutes < 60) return `${minutes}分钟前`;
                if (hours < 24) return `${hours}小时前`;
                if (days < 7) return `${days}天前`;
                
                return date.toLocaleDateString('zh-CN');
            } catch {
                return timestamp;
            }
        }
        
        // 页面加载时获取数据
        document.addEventListener('DOMContentLoaded', loadData);
        
        // 每5分钟自动刷新
        setInterval(loadData, 5 * 60 * 1000);
        
        // 键盘快捷键: Ctrl+R 刷新
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'r') {
                e.preventDefault();
                loadData();
                showToast('数据刷新中...');
            }
        });
        
        // 显示提示
        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #10b981;
                color: white;
                padding: 10px 20px;
                border-radius: 8px;
                z-index: 1000;
                animation: slideIn 0.3s;
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // 添加CSS动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
