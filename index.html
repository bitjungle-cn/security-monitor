<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>区块链安全事件监控 - 比特丛林</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 36px;
            color: #60a5fa;
            margin: 0;
        }
        .header p {
            color: #94a3b8;
            margin-top: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            border: 1px solid #334155;
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 14px;
        }
        .high-risk { color: #ef4444; }
        .medium-risk { color: #f59e0b; }
        .low-risk { color: #10b981; }
        .events {
            background: #1e293b;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid #334155;
        }
        .events h2 {
            margin-top: 0;
            color: #60a5fa;
        }
        .event-item {
            background: #0f172a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #3b82f6;
        }
        .event-time {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .event-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #e2e8f0;
        }
        .event-content {
            color: #cbd5e1;
            font-size: 14px;
        }
        .footer {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
            font-size: 14px;
            border-top: 1px solid #334155;
            margin-top: 40px;
        }
        .last-updated {
            color: #60a5fa;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚨 区块链安全事件监控</h1>
            <p>实时追踪区块链生态中的安全威胁 | 比特丛林团队</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="total-events">0</div>
                <div class="stat-label">累计事件</div>
            </div>
            <div class="stat-card">
                <div class="stat-value high-risk" id="high-risk">0</div>
                <div class="stat-label">高风险</div>
            </div>
            <div class="stat-card">
                <div class="stat-value medium-risk" id="medium-risk">0</div>
                <div class="stat-label">中风险</div>
            </div>
            <div class="stat-card">
                <div class="stat-value low-risk" id="low-risk">0</div>
                <div class="stat-label">低风险</div>
            </div>
        </div>
        
        <div class="events">
            <h2>📋 最新安全事件</h2>
            <div id="events-list">
                <!-- 事件将动态加载 -->
            </div>
        </div>
        
        <div class="footer">
            <p>最后更新: <span class="last-updated" id="last-updated">刚刚</span></p>
            <p>© 2026 比特丛林团队 | 数据实时更新 | 安全监控系统 v1.0</p>
        </div>
    </div>
    
    <script>
        // 加载数据
        async function loadData() {
            try {
                const response = await fetch('./data/events.json');
                const data = await response.json();
                updatePage(data);
            } catch (error) {
                console.log('加载数据失败:', error);
            }
        }
        
        function updatePage(data) {
            // 更新统计
            document.getElementById('total-events').textContent = data.total_events || 0;
            document.getElementById('high-risk').textContent = data.high_risk || 0;
            document.getElementById('medium-risk').textContent = data.medium_risk || 0;
            document.getElementById('low-risk').textContent = data.low_risk || 0;
            
            // 更新事件列表
            const eventsList = document.getElementById('events-list');
            if (data.events && data.events.length > 0) {
                eventsList.innerHTML = data.events.map(event => 
                    `<div class="event-item">
                        <div class="event-time">${new Date(event.timestamp).toLocaleString('zh-CN')}</div>
                        <div class="event-title">${event.title}</div>
                        <div class="event-content">${event.content}</div>
                    </div>`
                ).join('');
            } else {
                eventsList.innerHTML = '<p>暂无最新事件</p>';
            }
            
            // 更新时间
            document.getElementById('last-updated').textContent = new Date().toLocaleString('zh-CN');
        }
        
        // 初始加载
        loadData();
        
        // 每5分钟自动刷新
        setInterval(loadData, 300000);
    </script>
</body>
</html>
