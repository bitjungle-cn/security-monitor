<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>区块链安全事件监控 - 待审核</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 20px; line-height: 1.6; color: #333; background-color: #f8f9fa; }
        .header { background: #2c3e50; color: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tweet-card { border: 1px solid #e1e8ed; padding: 20px; margin: 15px 0; border-radius: 12px; transition: all 0.3s ease; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; overflow: hidden; }
        .tweet-card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); border-color: #1da1f2; }
        .tweet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85em; color: #657786; }
        .tweet-text { font-size: 1.1em; margin-bottom: 18px; white-space: pre-wrap; color: #14171a; font-weight: 400; }
        .tweet-metrics { display: flex; gap: 25px; font-size: 0.9em; color: #657786; border-top: 1px solid #f5f8fa; padding-top: 15px; }
        .metric-item { display: flex; align-items: center; gap: 6px; }
        .tweet-link { display: inline-block; background: #1da1f2; color: white; padding: 8px 20px; border-radius: 30px; text-decoration: none; font-size: 0.9em; font-weight: bold; margin-top: 15px; transition: background 0.2s; }
        .tweet-link:hover { background: #1991db; }
        .tag { padding: 4px 12px; border-radius: 20px; font-size: 0.75em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .tag-security { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .tag-maybe { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
        #loading { text-align: center; padding: 60px; color: #657786; font-size: 1.2em; }
        .stats-bar { margin-top: 10px; font-size: 0.9em; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 推特安全事件实时预扫描</h1>
        <div class="stats-bar">
            <span id="last-update">最后扫描时间: 加载中...</span> | 
            <span id="stats">共获取 0 条推文</span>
        </div>
        <p style="margin-top: 15px; font-size: 0.95em; opacity: 0.8;">数据来源于 xurl 实时抓取，由 OpenClaw 进行智能过滤。点击下方链接可查看原始推文。</p>
    </div>

    <div id="loading">正在连接数据源，请稍候...</div>
    <div id="tweet-container"></div>

    <footer style="text-align: center; margin-top: 50px; padding: 30px; color: #657786; font-size: 0.85em; border-top: 1px solid #e1e8ed;">
        &copy; 2026 Bit Jungle Security | Powered by 🦞 OpenClaw
    </footer>

    <script>
        async function loadTweets() {
            try {
                // 1. 首先获取清单文件，确定最新的数据文件名
                const manifestResponse = await fetch('data/manifest.json?t=' + new Date().getTime());
                const manifest = await manifestResponse.json();
                const latestFile = manifest.latest || 'raw_tweets.json';
                
                // 2. 获取最新的推文数据
                const response = await fetch('data/' + latestFile + '?t=' + new Date().getTime());
                const tweets = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                
                // 设置时间
                let lastScanStr = manifest.last_updated ? new Date(manifest.last_updated).toLocaleString() : new Date().toLocaleString();
                if (tweets.length > 0 && tweets[0].collected_at) {
                    lastScanStr = new Date(tweets[0].collected_at).toLocaleString();
                }
                document.getElementById('last-update').innerText = `最后同步时间: ${lastScanStr} (文件: ${latestFile})`;
                document.getElementById('stats').innerText = `当前库中共有 ${tweets.length} 条原始记录`;
                
                const container = document.getElementById('tweet-container');
                container.innerHTML = ''; // 清空容器

                tweets.forEach(tweet => {
                    const metrics = tweet.public_metrics || {};
                    const card = document.createElement('div');
                    card.className = 'tweet-card';
                    
                    // 简单的安全判定逻辑（前端仅展示）
                    const securityKeywords = ['币被盗', 'stolen', 'hacked', 'exploit', '钱包被盗', '黑客', 'attack', 'breach'];
                    const isPotential = securityKeywords.some(kw => tweet.text.toLowerCase().includes(kw));
                    const tagHtml = isPotential 
                        ? '<span class="tag tag-security">🔥 潜在风险</span>' 
                        : '<span class="tag tag-maybe">🔎 待核实</span>';

                    card.innerHTML = `
                        <div class="tweet-header">
                            <span>推文 ID: ${tweet.id} | 发布时间: ${tweet.created_at ? new Date(tweet.created_at).toLocaleString() : '未知'}</span>
                            ${tagHtml}
                        </div>
                        <div class="tweet-text">${tweet.text}</div>
                        <div class="tweet-metrics">
                            <div class="metric-item">👁️ 浏览: ${metrics.impression_count || 0}</div>
                            <div class="metric-item">❤️ 点赞: ${metrics.like_count || 0}</div>
                            <div class="metric-item">🔁 转发: ${metrics.retweet_count || 0}</div>
                            <div class="metric-item">💬 回复: ${metrics.reply_count || 0}</div>
                        </div>
                        <a href="https://twitter.com/i/web/status/${tweet.id}" target="_blank" class="tweet-link">🔗 在 Twitter 上查看详情</a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="color: #dc2626; background: #fee2e2; padding: 20px; border-radius: 8px;">
                        <strong>⚠️ 数据同步失败</strong><br>
                        未能读取到 data/raw_tweets.json。请确保采集脚本已成功运行并已推送至 GitHub。
                    </div>
                `;
            }
        }
        loadTweets();
    </script>
</body>
</html>
