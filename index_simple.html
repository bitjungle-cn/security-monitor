<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 区块链安全事件监控 - 比特丛林</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #10b981;
            --secondary: #3b82f6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark);
            color: var(--light);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: #1e293b;
            border-radius: 20px;
            border: 1px solid #334155;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        .header p {
            color: var(--gray);
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto 20px;
        }
        
        .update-info {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #334155;
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: var(--gray);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .events-container {
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid #334155;
        }
        
        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        
        .events-header h2 {
            font-size: 1.8rem;
        }
        
        .event-card {
            background: #0f172a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        
        .event-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--light);
        }
        
        .event-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        .event-content {
            margin-bottom: 20px;
            line-height: 1.7;
            color: #cbd5e1;
        }
        
        .event-metrics {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
        }
        
        .metric {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .metric-value {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .metric-label {
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        .footer {
            text-align: center;
            padding: 30px;
            color: var(--gray);
            font-size: 0.9rem;
            border-top: 1px solid #334155;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .stats-cards {
                grid-template-columns: 1fr;
            }
            
            .event-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .event-metrics {
                flex-wrap: wrap;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> 区块链安全事件监控</h1>
            <p>实时监控推特上的区块链安全事件，包括币被盗、钱包攻击、DeFi漏洞等安全威胁</p>
            <div class="update-info">
                <i class="fas fa-clock"></i>
                <span>最后更新: <span id="last-updated">加载中...</span></span>
            </div>
        </div>
        
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-number" id="total-events">0</div>
                <div class="stat-label">累计事件</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="high-risk">0</div>
                <div class="stat-label">高风险事件</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="medium-risk">0</div>
                <div class="stat-label">中风险事件</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="low-risk">0</div>
                <div class="stat-label">低风险事件</div>
            </div>
        </div>
        
        <div class="events-container">
            <div class="events-header">
                <h2><i class="fas fa-exclamation-triangle"></i> 安全事件列表</h2>
            </div>
            
            <div id="events-list">
                <p style="text-align: center; color: var(--gray);">
                    <i class="fas fa-spinner fa-spin" style="margin-right: 10px;"></i>
                    正在加载安全事件数据...
                </p>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 比特丛林 | <i class="fas fa-globe"></i> 安全监控系统 v3.1</p>
            <p>数据来源: Twitter API 实时搜索 | 更新时间: <span id="update-time">-</span></p>
            <p>数据状态: <span id="data-status">加载中...</span></p>
        </div>
    </div>
    
    <script>
        // 简单数据加载
        async function loadSimpleData() {
            try {
                const response = await fetch('./data/events.json');
                const data = await response.json();
                
                // 更新统计
                document.getElementById('total-events').textContent = data.metadata.total_events || 0;
                document.getElementById('high-risk').textContent = data.metadata.high_risk || 0;
                document.getElementById('medium-risk').textContent = data.metadata.medium_risk || 0;
                document.getElementById('low-risk').textContent = data.metadata.low_risk || 0;
                
                // 更新时间
                document.getElementById('last-updated').textContent = 
                    new Date(data.metadata.last_updated).toLocaleString('zh-CN');
                
                document.getElementById('update-time').textContent = 
                    new Date(data.metadata.last_updated).toLocaleTimeString('zh-CN');
                
                // 数据状态
                document.getElementById('data-status').textContent = '✅ 数据已加载';
                document.getElementById('data-status').style.color = '#10b981';
                
                // 显示事件
                displaySimpleEvents(data.events);
                
                // 停止加载动画
                const spinners = document.querySelectorAll('.fa-spinner');
                spinners.forEach(spinner => {
                    spinner.classList.remove('fa-spinner', 'fa-spin');
                    spinner.classList.add('fa-check-circle');
                    spinner.style.color = '#10b981';
                });
                
            } catch (error) {
                console.error('数据加载失败:', error);
                
                document.getElementById('events-list').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #ef4444;">
                        <i class="fas fa-exclamation-circle" style="font-size: 3rem; margin-bottom: 20px;"></i>
                        <p>数据加载失败</p>
                        <p style="font-size: 0.9rem;">请检查网络连接或稍后重试</p>
                    </div>
                `;
                
                document.getElementById('data-status').textContent = '❌ 数据加载失败';
                document.getElementById('data-status').style.color = '#ef4444';
            }
        }
        
        function displaySimpleEvents(events) {
            const container = document.getElementById('events-list');
            
            if (!events || events.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--gray);">
                        <i class="fas fa-check-circle" style="color: #10b981; font-size: 3rem; margin-bottom: 20px;"></i>
                        <p>暂无新的安全事件</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            events.forEach((event, index) => {
                const metrics = event.metrics || {};
                const views = metrics.views?.toLocaleString() || '0';
                const likes = metrics.likes?.toLocaleString() || '0';
                const retweets = metrics.retweets?.toLocaleString() || '0';
                
                html += `
                <div class="event-card">
                    <h3 class="event-title">${event.title || '安全事件'}</h3>
                    <div class="event-meta">
                        <span><i class="fas fa-user"></i> ${event.author || '未知作者'}</span>
                        <span><i class="fas fa-keyword"></i> ${event.keyword || '安全'}</span>
                        <span><i class="fas fa-clock"></i> ${formatTime(event.timestamp)}</span>
                    </div>
                    <div class="event-content">
                        ${event.content || '暂无内容描述'}
                    </div>
                    <div class="event-metrics">
                        <div class="metric">
                            <i class="fas fa-eye" style="color: #3b82f6;"></i>
                            <div>
                                <div class="metric-value">${views}</div>
                                <div class="metric-label">浏览</div>
                            </div>
                        </div>
                        <div class="metric">
                            <i class="fas fa-heart" style="color: #ef4444;"></i>
                            <div>
                                <div class="metric-value">${likes}</div>
                                <div class="metric-label">点赞</div>
                            </div>
                        </div>
                        <div class="metric">
                            <i class="fas fa-retweet" style="color: #10b981;"></i>
                            <div>
                                <div class="metric-value">${retweets}</div>
                                <div class="metric-label">转发</div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function formatTime(timestamp) {
            if (!timestamp) return '未知时间';
            
            try {
                const date = new Date(timestamp);
                const now = new Date();
                const diff = now - date;
                const minutes = Math.floor(diff / 60000);
                const hours = Math.floor(minutes / 60);
                const days = Math.floor(hours / 24);
                
                if (minutes < 1) return '刚刚';
                if (minutes < 60) return `${minutes}分钟前`;
                if (hours < 24) return `${hours}小时前`;
                if (days < 7) return `${days}天前`;
                
                return date.toLocaleDateString('zh-CN');
            } catch {
                return timestamp;
            }
        }
        
        // 页面加载时获取数据
        document.addEventListener('DOMContentLoaded', loadSimpleData);
        
        // 每10分钟自动刷新
        setInterval(loadSimpleData, 10 * 60 * 1000);
    </script>
</body>
</html>
